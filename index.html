<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mana spēle</title>
<style>
/* Pamata izkārtojums — šīs rindas nemaini */
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px 16px; margin: 6px 0; cursor: pointer; }
img, audio { max-width: 100%; }
[hidden] { display: none !important; }

/* NOFORMĒ ŠEIT: pielieto 2.1. un 2.2. nodarbībā apgūto CSS */
body {
  background-color: #12c2f8;
  color: #4d68fd;
}

h1 {
  color: #fff349;
}

.noteikumi {
  background-color: #ec29e3;
  color: #3afaf0;
  padding: 12px;
}

.laukums {
  width: 360px;
  padding: 20px;
  border-radius: 12px;
  margin: 20px auto;
  max-width: 100%;
  text-align: center;
  border: 2px solid #1302ff;
  background-color: #b9d2eb;
  box-sizing: border-box;
}

button {
  background-color: #82ffee;
  color: #ff9595;
  border: 0;
  border-radius: 8px;
}
</style>
</head>
<body>
<h1>Spēles nosaukums</h1>
<p>Īss spēles mērķa apraksts spēlētājam.</p>
<section class="noteikumi">
  <h2>Noteikumi</h2>
  <p>spēlētājs izliek kārtis kuras vinam nav vajadzīgas</p>
  <p>izskan uzvaras mūzika kad spēlētajs uzspiež uzvaras pogu.</p>
</section>
<div class="laukums">
  <h2>Spēles laukums</h2>
  <img src="atteli/varonis.svg" alt="Spēles varonis" width="128">
  <p>Skaņas efekta nozīme spēlē:</p>
  <audio controls src="skanas/klikskis.wav"></audio>
  <p id="punkti">Punkti: 0</p>
  <button onclick="savakt()">Savākt punktu</button>
</div>
<script>
// Gatava punktu poga — šo skriptu nemaini.
let punkti = 0;
function savakt() {
  punkti = punkti + 1;
  document.getElementById("punkti").textContent = "Punkti: " + punkti;
}
</script>
</body>
</html>
