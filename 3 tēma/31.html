<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>uno trio</title>
<style>
/* Pamata izkārtojums — šīs rindas nemaini */
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; background-color: #f8fafc; color: #1e293b; }
.panelis { background-color: #ffffff; border: 2px solid #cbd5e1; border-radius: 12px; padding: 18px; margin: 16px 0; }
.panelis p { margin: 8px 0; font-size: 18px; }
button, input { font: inherit; padding: 10px 16px; margin: 4px; }
button { cursor: pointer; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<h1 id="nosaukums">uno trio</h1>
<p id="apraksts">sakrājot vajadzīgās kārtis un uzvar.</p>
<div class="panelis">
  <p id="punkti">Punkti: 0</p>
  <p id="dzivibas">Dzīvības: 0</p>
  <p id="merkis">Mērķis: nav aprēķināts</p>
  <!-- 3. UZDEVUMS: šeit zemāk pievieno jaunu <p id="merkis"> rindkopu -->
</div>
<script>
// === 1. UZDEVUMS — MAINI ŠEIT: spēles sākuma dati ===
const nosaukums = "uno trio";
const apraksts = "izliec necvajadzīgās kārtis";
let punkti = 17;
let dzivibas = 3;
const merkaPunkti = 35;

// === 2. UZDEVUMS — RAKSTI ŠEIT: punktu un dzīvību aprēķini ===
punkti = punkti + 7
dzivibas = dzivibas - 1;
let lidzMerkim = merkaPunkti - punkti;

// === GATAVĀ PARĀDĪŠANAS DAĻA (3. uzdevumā papildini ar mērķa rindu) ===
document.getElementById("nosaukums").textContent = nosaukums;
document.getElementById("apraksts").textContent = apraksts;
document.getElementById("punkti").textContent = "Punkti: " + 17;
document.getElementById("dzivibas").textContent = "Dzīvības: " + 3;
document.getElementById("merkis").textContent = "Līdz uzvarai vēl: " + lidzMerkim + " punkti";
</script>
</body>
</html>
