<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>uno trio</title>
<style>
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px; margin: 4px; }
button { cursor: pointer; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
body { background-color: #02defc; color: #ff0000; }
button { background-color: #f16eeb; color: rgb(152, 242, 248); border: 0; border-radius: 8px; }
</style>
</head>
<body>
<h1>uno trio</h1>
<p>izliec nevajadzīgās kārtis un uzvari draugus ar vajadzīgajām kārtīm.</p>
<img src="atteli/varonis.svg" alt="Zils kvadrātveida robots" width="128">
<p>Uzvaras skaņa:</p>
<audio controls src="skanas/klikskis.wav"></audio>
<p id="punkti">Punkti: 10</p>
<button onclick="savakt()">izlikt nevajadzīgās kārtis</button>
<script>
// Gatava poga. Šajā tēmā mācies noformēt lapu un sakārtot failus.
let punkti = 10;
function savakt() {
  punkti = punkti + 1;
  document.getElementById("punkti").textContent = "Punkti: " + punkti;
}
</script>
</body>
</html>
